# Site configuration for hussanulmaab.github.io  (served at blog.maab.dev)
# ========================================================================

url: https://hussanulmaab.github.io
baseurl: ""

lang: en

title: Hussan ul Maab

description: >
  Quantum error correction researcher.

tagline: >
  Researcher in Fault Tolerant Quantum Computing and Quantum Information Theory, sometimes drifted away into
  Pure Mathematics.

keywords:
  [
    quantum error correction,
    tensor networks,
    color codes,
    quantum computing,
    decoders,
  ]

author:
  name: Hussan ul Maab
  email: maab431@khu.ac.kr

# Sidebar navigation
menu:
  - title: About
    url: /
  - title: Blog
    url: /blog/
  - title: Publications
    url: /publications/
  - title: Talks
    url: /talks/
  - title: CV
    url: /assets/HussanulMaab_CV.pdf

legal: []

copyright: © 2026 Hussan ul Maab.

permalink: /blog/:year-:month-:day-:title/

theme: jekyll-theme-hydejack

# Look
logo: /assets/img/profile_blog.jpeg
accent_image: /assets/img/library_background_blog.jpg
accent_color: rgb(154,106,18)
theme_color: rgb(25,55,71)

defaults:
  # Never render the front-matter `description` as a visible banner on a page.
  # It is still used for meta tags, link previews and search results.
  - scope:
      path: ""
    values:
      hide_description: true
  - scope:
      path: assets/
    values:
      sitemap: false

kramdown:
  math_engine: mathjax
  math_engine_opts: {}
  footnote_backlink: "&#x21a9;&#xfe0e;"

hydejack:
  # Light mode on every page. No toggle, so there is only ever one mode.
  dark_mode:
    always: false
    icon: false

  post_addons: [related]
  no_breadcrumbs: true
  no_mark_external: false
  # Full page loads: keeps per-post <script> blocks (e.g. the three.js cube) reliable.
  no_push_state: true
  no_drawer: false
  no_navbar: false
  no_search: false
  no_inline_css: false
  no_page_style: false
  no_break_layout: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
