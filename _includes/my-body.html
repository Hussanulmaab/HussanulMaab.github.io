<!--
  Extra markup for the end of <body>. Hydejack includes this file on every
  page, so it must exist, but it can be empty.
-->

<!-- Expand button: opens a full-screen view of the sidebar background. -->
<button id="_cover_btn" class="cover-btn" type="button"
        aria-label="Expand background" aria-expanded="false">
  <span class="cover-btn-arrow" aria-hidden="true">&rsaquo;</span>
</button>

<script>
(function () {
  var btn = document.getElementById('_cover_btn');
  if (!btn) return;

  var overlay = null;

  // Sit the button on the sidebar's right edge, whatever width it is at this
  // breakpoint (21rem normally, a percentage on very wide screens).
  //
  // Measure #_drawer, NOT .sidebar: hy-drawer applies a translate to .sidebar,
  // so its bounding rect reports a right edge far off to the right. The drawer
  // itself is untransformed and its right edge is the true visible edge.
  function place() {
    var anchor = document.getElementById('_drawer') ||
                 document.querySelector('.sidebar');
    if (!anchor) return;
    var right = anchor.getBoundingClientRect().right;
    if (right > 0) btn.style.left = Math.round(right) + 'px';
  }

  function build() {
    overlay = document.createElement('div');
    overlay.className = 'cover-overlay';

    var bg = document.querySelector('.sidebar-bg');
    var pane = document.createElement('div');
    pane.className = 'cover-overlay-bg';
    if (bg) pane.style.backgroundImage = getComputedStyle(bg).backgroundImage;
    overlay.appendChild(pane);

    // Clone the real sidebar contents so name, tagline, nav and social links
    // stay in sync with the site. No duplicated markup to maintain.
    var sticky = document.querySelector('.sidebar-sticky');
    if (sticky) {
      var clone = sticky.cloneNode(true);
      clone.removeAttribute('id');
      clone.className = 'cover-overlay-content';
      overlay.appendChild(clone);
    }

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay || e.target === pane) close();
    });

    document.body.appendChild(overlay);
  }

  function open()  {
    if (!overlay) {
      build();
      // Force a layout pass so the browser has a starting position to
      // animate from; without this the first open jumps with no transition.
      overlay.getBoundingClientRect();
    }
    requestAnimationFrame(function () {
      document.body.classList.add('cover-open');
      btn.setAttribute('aria-expanded', 'true');
    });
  }

  function close() {
    document.body.classList.remove('cover-open');
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', function () {
    document.body.classList.contains('cover-open') ? close() : open();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });

  addEventListener('resize', place);
  addEventListener('load', place);

  // The drawer sets its own width after it initialises, so measure again
  // shortly after first paint rather than trusting the first reading.
  place();
  setTimeout(place, 300);
  setTimeout(place, 1000);
})();
</script>
